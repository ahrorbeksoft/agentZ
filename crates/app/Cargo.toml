[package]
name = "app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "agentz"
path = "src/main.rs"

[features]
# Compiles Metal shaders at runtime so macOS builds work without a full Xcode install.
default = ["runtime_shaders"]
runtime_shaders = ["gpui_platform/runtime_shaders"]

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
agent_thread.workspace = true
anyhow.workspace = true
collections.workspace = true
assets.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
log.workspace = true
markdown.workspace = true
menu.workspace = true
projects.workspace = true
registry.workspace = true
reqwest_client.workspace = true
smol.workspace = true
text_input.workspace = true
theme.workspace = true
theme_json.workspace = true
ui.workspace = true
util.workspace = true
