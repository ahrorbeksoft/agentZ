[package]
name = "app"
version = "0.2.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[[bin]]
name = "agentz"
path = "src/main.rs"

[features]
# Compiles Metal shaders at runtime so macOS builds work without a full Xcode install.
default = ["runtime_shaders"]
runtime_shaders = ["gpui_platform/runtime_shaders"]

[lints]
workspace = true

[dependencies]
base64.workspace = true
agent-client-protocol.workspace = true
agentz_client.workspace = true
agentz_protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
collections.workspace = true
assets.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
http_client.workspace = true
idna.workspace = true
image.workspace = true
log.workspace = true
markdown.workspace = true
menu.workspace = true
paths.workspace = true
projects.workspace = true
regex.workspace = true
reqwest_client.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
strum.workspace = true
text_input.workspace = true
theme.workspace = true
theme_json.workspace = true
tokio.workspace = true
ui.workspace = true
unicode-properties.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
util.workspace = true

# As Zed's: without them GPUI takes Linux for headless and opens no window.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSSound"] }
objc2-foundation.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
