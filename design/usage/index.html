<script>
const TOPICS = [];
window.ROUND_INTRO = `<p>agentZ shows an account's usage in three places: <b>Settings › Usage</b>, the <b>gauge in a thread's composer</b> and its popover, and the <b>Account tab</b> on an agent's page. You asked for a better Usage page (feedback #5), a better popover in threads (#6), and an Account tab that stays clear with several accounts and gives feedback when you add one (#7).</p>
<p>The three views are designed together here, so a window (5-hour, Weekly, Monthly…) reads the same way in each. Topic 1 picks that shared row; the others use it. What was picked in the Accounts round still holds unless a topic here changes it: bars show what's <b>left</b>, with a hairline for even spending, yellow at 15% or less, red when used up; Droid's pools are tabs; each account has a color.</p>
<p>The mocks use made-up accounts: <b>Claude Agent</b> with 2, <b>Codex</b> and <b>Devin</b> with 1, <b>Factory Droid</b> with 6 and <b>Google Antigravity</b> with 4. They are One Dark at the app's sizes. The screenshots beside each topic are today's app; some show your real accounts and are kept out of git.</p>`;
</script>
<script src="topics-usage.js"></script>
