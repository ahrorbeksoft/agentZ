<script>
const TOPICS = [];
window.ROUND_INTRO = `<p><b>Boards</b>: a kind of artifact for picking between designs. The agent gives only the designs (a picture or a built page each) and the words (an intro, what’s there today, each design’s name, description, Good and Cost, and its recommendation); agentZ draws the board around them, as this design board is drawn: topics, cards, Pick and + Also, comments, notes, a summary and Send to thread. Already decided: your picks are kept on the server with the board, and the agent can read them whenever it likes. This round is the rest.</p>
<p>Why: today an agent either writes a whole board page itself, hundreds of lines each time, whose picks are lost on reload (artifact pages have no storage), or it publishes each design as its own artifact, as an agent in another project did with five designs, leaving five unrelated pages and nothing to pick between them.</p>
<p>The models: agentZ’s own <b>design board</b> (this page: topics, cards, picks, comments, a summary, saving), the <b>artifacts</b> round’s decisions (the page’s bar, versions, Send to thread, the card in the thread, All artifacts), Claude Code’s artifacts, and <b>t3code</b>, which takes pictures of its pages on the server.</p>
<p>Words used: a <b>board</b> is the artifact; a <b>topic</b> is one question on it; a <b>design</b> is one option in a topic; a <b>pick</b> is what you chose. The demo: Claude Agent in <i>Design the plans page</i> (storefront) made five plans page designs; the pictures are real pages, rendered for this round. The mocks are JetBrains Dark, your theme, at real sizes in a 1280 px browser. The screenshots beside the topics are today’s agentZ with the demo’s five designs published as five artifacts.</p>`;
</script>
<script src="mock-boards.js"></script>
<script src="topics-boards.js"></script>
