window.ROUND_INTRO = `<p>Your request: “What should we do about model visibility settings, like hiding certain models and stuff, maybe favorites too. Learn how t3code does it.” Today the composer’s model picker lists every model the agent offers: Factory Droid’s 66, OpenCode’s 111, Claude Agent’s 4, and Defaults’ Model menu in Settings lists them all again.</p>
<p><b>How t3code does it.</b> Settings › Providers has a Models list for each provider: a star, the name, Move up and Move down, and a switch (“Shown in picker” or “Hidden from picker”), in three groups (Favorites, All, Hidden from picker), with Filter models, counts and Disable all. Hidden models and their order are each provider’s, favorites are global, and all of it syncs to every device. Its picker leaves hidden models out entirely, has a rail with Favorites first and opens on it, and moves a composer whose model was hidden to the first shown one. <b>Zed</b> has favorites only: a star at a row’s end on hover, a Favorite section on top of the picker, kept per agent, with keys to open the picker and cycle favorites.</p>
<p>The mocks share one world: the Factory Droid thread <b>“Speed up the checkout page”</b> in agentZ, on Opus 5.5 at Extra High. Droid has two accounts here, Personal and Work, and runs on This Mac and Devbox 1. You use 16 of its 66 models and hide the other 50; where favorites appear, Droid’s are Opus 5.5, GPT-6.1 Sol and Gemini 4 Argon, Claude Agent’s Opus 5.5 and Sonnet 5.5, and Codex’s 6.1 Sol. Words used: the <b>picker</b> is the menu the model chip beside Send opens; the <b>Models list</b> is where you choose which models it shows (topic 1). You also asked for Reasoning Effort in a submenu and a shorter picker: topics 13 and 14. Where topics meet, the mocks use the recommended pick of the other topic, and each topic says which; every new picker has the effort in its submenu row and eight rows of models.</p>`;
