const TOPICS = [];
window.ROUND_INTRO = `<p>From the backlog: “When a design is a live page, it doesn’t need separate desktop and mobile views. Maybe make the preview resizable instead.” A live page is responsive HTML, so a second “mobile” page is the same page again, yet with Sizes › Both an agent publishes two files per variant (<code>page</code> and <code>phone_page</code>) and the bar’s Desktop · Phone swaps between them. This round decides how the one page is resized, where, and what happens to Desktop · Phone and the phone versions.</p>
<p>Today’s pictures are recreated from the design page’s own markup and styles (<code>design.html</code>, <code>shared.css</code>) in headless Chromium, not screenshots of the running app. The mocks are the design page in JetBrains Dark, at real sizes; the sample page (a plans page in three variants) is real responsive HTML drawn at each width, so its layout reflows as an agent’s page would. Words used: a <b>live page</b> is a variant’s HTML file; the <b>card</b> shows it scaled down, non-interactive; the <b>close-up</b> is the full-size overlay (Open page), interactive; <b>width</b> is the page’s viewport width, the height follows the window.</p>`;
</script>
