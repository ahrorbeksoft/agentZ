<script>
const TOPICS = [];
window.ROUND_INTRO = `<p>You said: finished subthreads can’t be hidden from the Agents list, and that’s not bad, but the rows <b>don’t look good</b>, maybe because of their labels. An open subthread should look <b>a little different</b> from a main thread. And the <b>way back</b> to the parent was hard to find.</p>
<p>Today a parent thread lists its subthreads above its composer, under a line like “3 Agents · 1 running”. Each row has a status icon, the title, “Factory Droid · research” (the agent and the task’s role, which the parent agent picks) and a status word such as “Done”. A click opens the subthread. It has the same header as a main thread, a small “Sent by the agent in …” label above its first message, and in place of the composer a bar: “A subagent of ‘…’. It runs on its own; message its parent instead.” with Open Parent at the far right. That button is the only way back. The sidebar highlights the parent’s card while a subthread is open, since subthreads aren’t in the sidebar.</p>
<p>This round decides the list’s rows and what happens to finished ones, the subthread’s header, whether anything else sets it apart, the start of its conversation, what replaces its composer, and a shortcut back. The list came from t3code’s subagent bar and lineage panel; Zed shows a subagent as a card in its parent and, opened, with a title bar whose Minimize button goes back.</p>
<p>Words used: a <b>subthread</b> is a thread another thread’s agent started with <code>delegate_task</code>; its <b>parent</b> is the thread that started it. The <b>Agents list</b> is the list above the parent’s composer. The <b>header</b> is the bar along the top of a thread. Where topics meet, the mocks use the recommended pick of the other topic, and each topic says which.</p>`;
</script>
