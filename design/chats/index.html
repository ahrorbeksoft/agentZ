<script>
const TOPICS = [];
window.ROUND_INTRO = `<p>From the backlog: “Chats are for general conversation, not for work in a project. They have their own group in the sidebar, like the Workspaces and Archived shelves, and never belong to a project.” They have everything a thread has (agents, accounts, models, images, files, queued messages, subthreads), mention projects, threads and files with @ instead of being linked to them, publish artifacts, and a setting turns them off. Worktrees, pastures, diffs, branches and project scripts are hidden in a chat.</p>
<p>How t3code does it: a thread can start without a project (No project in the new thread’s project menu, in New thread in…, or mod+alt+n). Each works in its own folder under the data folder’s scratch folder, named after the date, the first words of its first message and a short id; deleting the thread keeps the folder. Branch, worktree and diff controls are hidden. It starts on the current machine and can move to another before its first message. Inside, it belongs to a hidden Scratch project on each machine.</p>
<p>In agentZ a chat would also need its own folder (ACP’s session/new takes one) and runs on one machine. The demo: storefront and docs on this Mac, api on Devbox 1, and five chats. The mocks are JetBrains Dark at the app’s sizes; the screenshots beside the topics are today’s app with the mock agent, also in JetBrains Dark.</p>`;
</script>
