const TOPICS = [];
window.ROUND_INTRO = `<p>The backlog says: “Follow t3code’s thread snooze: hide a thread until a chosen time, including its quota reset when known, then return it to the list. Keep snooze independent of archiving and automatic resume; waking a snoozed thread does not itself send a prompt. Persist its wake time so snooze survives app and server restarts.”</p>
<p>In t3code, a clock on a hovered thread row (or Snooze in its menu) offers In 1 hour, In 3 hours, This evening, Tomorrow, Next week and Custom…. Snoozed threads move to a Snoozed shelf with the time left, come back marked “Woke”, and wake early if they need you. Its usage-limit banner has “Snooze until reset”. The wake time is kept with the thread on its machine’s server, like the time a thread continues after a limit, so it survives restarts; archiving or deleting a thread ends its snooze.</p>
<p>Today’s pictures are recreated from the code in HTML, not captured from the running app (this machine has no display). The mocks use One Dark and the board’s demo threads on storefront and api; the clock reads Tuesday 14:42, and agentZ writes times on a 24-hour clock.</p>`;
</script>
