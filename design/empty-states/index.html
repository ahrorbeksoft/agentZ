const TOPICS = [];
window.ROUND_INTRO = `<p>What the main area shows when nothing is open. In the <b>Agents view</b> that's every launch (no thread opens by itself) and after the open thread is archived or deleted: today a line, "Select a thread, or start a new one", and a New Thread button. Before the first project it says the same. In the <b>Workspaces view</b> it's only when there are no workspaces, since it otherwise always shows one: "No workspaces" and a faint New Workspace button, with "No workspaces yet" and "No agents yet" in the sidebar.</p>
<p>Zed shows a Welcome page (Get Started, Recent Projects) and, in an empty panel, a short line with a button, "or", and a second button. t3code no longer shows an empty thread area at all: it opens a draft in the latest project, and moves to the project's next thread after a delete. herdr starts in a workspace. The mocks use the board's demo world in One Dark: storefront on this Mac and api on Devbox 1, with agents the server kept running while the app was closed.</p>`;
