const TOPICS = [];
window.ROUND_INTRO = `<p>You wrote: “We gotta simplify thread terminals.” You didn’t say what to cut, so the options run from small trims to a different model.</p>
<p>Today a thread’s terminal opens with <b>Cmd-J</b> or the terminal button in the thread’s header. It sits under the composer, 280 pixels tall, and its top edge drags. It starts with one shell and a bordered toolbar floating over the shell’s top right corner: split side by side, split top and bottom, new terminal (+), full screen, and close (×). + adds a shell in a group of its own. A split adds one beside the shell in front, up to four in a group, sharing the space evenly. One group shows at a time. From the second shell on, a list on the right names the groups and shells, and the buttons move into it. × ends the shell in front at once. Hiding keeps every shell running, with a dot on the header button. This follows t3code’s terminal drawer, with full screen added.</p>
<p>This round decides how many shells a thread has and whether they split, which buttons stay, where they go, what closing does, where the terminal sits, and how it resizes. Workspaces panes are a separate feature and don’t change. Zed’s terminal panel (tabs, a Split menu, Zoom) and herdr’s panes are the references.</p>
<p>Words used: the <b>terminal</b> is the area at the bottom of a thread. A <b>shell</b> is one session in it. A <b>tab</b> is one shell’s name in a strip above it, as in Zed’s terminal panel. A <b>split</b> shows two shells at once, side by side or one above the other. <b>Hide</b> keeps the shells running; <b>close</b> ends a shell. The mocks are a thread in One Dark at the app’s sizes. Where a mock has a dark strip on top, that strip isn’t part of the app: it shows today’s toolbar beside the change.</p>`;
</script>
