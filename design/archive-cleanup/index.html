window.ROUND_INTRO = `<p>The backlog says: “Use t3code’s new archived-thread retention rules (#15208, called settled retention there), shared-subagent-worktree cleanup (#19748) and orphan reporting (#19749) as the implementation reference for our existing automatic workspace cleanup plan. Active sessions, shared worktrees and the chosen local-change protection must be respected. Any new UI starts on the design board.” The plan in <code>docs/architecture.md</code> names t3code’s inactive-days and merged rules and cow’s gc; the Storage round had picked “by hand only”, which this round revisits.</p>
<p>In t3code, Settings › Storage has rules that are all off at first: delete worktrees some days after their thread settles (0 means at the next hourly cleanup), after days without activity, once merged, with no commits of their own, or with their deleted thread; a choice of which local changes keep a worktree; and Delete now with a report of the last run. Branches and thread history stay, and the next turn makes the checkout again. It never removes a worktree whose session is open, that has a terminal or pending work, or that another thread shares (except a thread’s own subagents), and it lists folders no thread uses without removing them.</p>
<p>A thread’s <b>workspace</b> is its worktree or pasture; a thread in the project’s own checkout has none to remove. Today’s pictures are recreated from the code in HTML, not captured from the running app (this machine has no display). The mocks use One Dark and the Storage round’s demo on This Mac.</p>`;
