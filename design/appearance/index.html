const TOPICS = [];
window.ROUND_INTRO = `<p>Making the window see-through, or putting a picture behind it. GPUI, which agentZ is built on, already draws windows three ways: solid, clear, or blurred (on macOS an NSVisualEffectView, the frosted glass of Finder's sidebar, behind the window; on Linux, clear everywhere and blurred on KDE). Zed turns it on from a theme: <code>"background.appearance": "blurred"</code> with colors that are partly transparent. agentZ has that code from Zed but never applies it, so today every theme draws solid.</p>
<p>A picture behind the window is agentZ's own idea (neither Zed nor t3code has one): agentZ would draw the picture under everything and make the theme's surfaces partly transparent over it, so it looks the same on every desktop. The mocks put agentZ over a bright wallpaper and a browser window, to show what text over glass is like; colors are JetBrains Dark's, and a light theme gets the same treatment in white. The board's blur is a browser's, close to but not exactly macOS's.</p>`;
</script>
