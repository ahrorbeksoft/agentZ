const TOPICS = [];
window.ROUND_INTRO = `<p>Pinning keeps a thread at the top of the Agents sidebar until you unpin or archive it, as in t3code. What it does is settled: <b>Pin</b> and <b>Unpin</b> in a card’s menu and the thread’s title menu (no shortcut); pinned cards on top in the order you give them, the newest pin first; cards that <b>drag</b> to reorder the pinned ones, and the rest too while the thread order is Newest first (in Latest activity those follow their activity); a card dragged among the pinned ones is pinned, a pinned one dragged out is unpinned; a card dropped on <b>Archived</b> is archived (which unpins it), and an archived row dragged up into the list is unarchived. Shells, drafts, Workspaces threads and agent CLI cards aren’t pinned; CLI cards still drag among the rest.</p>
<p>This round is how that looks. t3code shows a muted pin on the card that unpins on click, nothing around the pinned cards at rest, and “Pinned” and “Active” labels only while a card is dragged, with a badge on the card saying what letting go does. agentZ’s workspace rows already drag by lifting: the row is raised and held where it was grabbed, and the rows it passes slide over. The mocks use the board’s demo world: storefront on this Mac, api on Devbox 1, two threads pinned.</p>`;
</script>
