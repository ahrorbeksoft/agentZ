window.ROUND_INTRO = `<p>You asked to take “every kind of tool call through design rounds again, agentZ’s own MCP tools included”, and for “a better view of subagents in threads”, “a better view of subthreads in threads” and a better way to handle “the message that tells an agent its delegated tasks ended”. This round covers agentZ’s own tools, subthreads and subagents; another round covers the agent’s own tool calls (reads, edits, commands, …).</p>
<p><b>agentZ’s own tools</b> are the 26 that agentZ gives every agent through its MCP server, in six groups: <b>threads</b> (list, read, start, message, wait for, interrupt, rename, pin or archive, and read the changes of other threads), <b>subthreads and delegated tasks</b> (<code>delegate_task</code>, and checking on or cancelling one), <b>workspaces</b> (this thread’s workspace, branches, handing off to a worktree or pasture, syncing and bringing back a pasture), <b>terminals and commands</b> (list, start, type into, read and wait for terminals, and run a command for its output), <b>projects</b> (add one) and <b>agents and models</b> (what agentZ can run). Today each is a row that says what it did (“Started a subthread: …”) with the agentZ mark, as the Tool calls round picked, and opens to its raw JSON.</p>
<p>A <b>subthread</b> is a thread an agent started with <code>delegate_task</code>; it’s listed in the <b>Agents list</b> over the parent’s composer. A <b>subagent</b> is one the agent starts with its own tool: <b>Claude Agent</b> sends each one’s steps in a session of its own, which agentZ makes a subthread; <b>Factory Droid</b>’s Task sends only its task and its report. When subthreads end, agentZ tells the parent’s agent with a <b>message</b> in your place, which wakes it if it’s idle.</p>
<p>Zed shows subagents as cards that preview their work; t3code names its own tools by what they did and shows child threads as rows with a status dot, and draws a child that ended as its row again. Claude Code shows a subagent’s last steps under it. The mocks are JetBrains Dark, your theme, at the app’s sizes (rows 24 px, row text 13 px). Yellow captions inside a mock are the board’s, not the app’s. Where topics meet, a mock uses the other topic’s recommended pick, and says so. The screenshots of today are from a scratch app in One Dark, driving the mock agent, except three of yours.</p>`;
</script>
