const TOPICS = [];
window.ROUND_INTRO = `<p>From the backlog: “A settings page (name not decided: Storage or similar) that lists what agentZ produces on disk, with sizes, so the user can see what takes space and delete it.” Chats come first, each with its size counting everything it keeps (its conversation, attachments and folder), and a way to delete them; other caches and logs maybe, not decided which.</p>
<p>How t3code does it: its Settings › Storage has no sizes, only rules: where new worktrees go; cleaning up worktrees on their own for each machine or project (after some days without use, once merged, or with no commits of their own, never with changes or a running session); deleting worktrees with deleted threads; and how many days to keep browser captures and old logs. Current logs and message attachments are always kept.</p>
<p>In agentZ each machine’s server keeps its own data folder (~/.agentz on Linux): each thread’s conversation, images and handoffs; threads’ worktrees and pastures; installed agents and the registry’s cache; downloaded Node.js; and the server’s log. Agents’ logins in account homes are never touched. The demo is This Mac with 6.0 GB, and Devbox 1. The mocks are JetBrains Dark at the app’s sizes; the screenshots are today’s app with the mock agent.</p>`;
</script>
