const TOPICS = [];
window.ROUND_INTRO = `<p>You said that when a message goes to an agent that isn't logged in, "it shows login (login also kinda ugly, we gotta improve that too)" (feedback #22). The other half of that report is built: such a message now fails with Retry. This round is the look.</p>
<p>Today a thread that needs a login shows a <b>panel</b> in the middle of the conversation: the agent's icon, "Log in to Factory Droid", "Every thread with Factory Droid shares the login.", what the agent said when it asked, then a full-width <b>button</b> for each of the agent's <b>login methods</b>, the first one filled. Picking one shows its <b>step</b> there: a code to enter in the browser, a terminal, or an API key field. The same login shows in two more places, each its own way: the <b>Add Account dialog</b> (built in the Usage round, its methods as a list with chevrons) and a logged-out account's card on an agent's <b>Account tab</b> (a row per method with Log In).</p>
<p>Zed shows the login as a callout at the bottom of an empty thread, with small buttons. t3code shows a banner that sends you to its provider settings, where its account rows log in. Each option says where it comes from.</p>
<p>The mocks use <b>Factory Droid</b>, whose methods are "Login" (a pairing code in the browser) and "Factory API Key", and <b>Claude Agent</b>, whose "Claude Subscription" and "Anthropic Console" both log in in a terminal. Their names, descriptions and Droid's message are what those agents send. The mocks are JetBrains Dark, your theme, at the app's sizes. The screenshots beside each topic are today's app with the mock agent (One Dark); its methods cover every kind, which is why it has five.</p>`;
</script>
