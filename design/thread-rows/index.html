<script>
const TOPICS = [];
window.ROUND_INTRO = `<p>Tool-call rows and the agent's messages read alike. Since the thread round, each tool call is a compact one-line row, always shown ("Ran npm test"). But a row's command is drawn in the message text's bright color, at almost its size, and JetBrains Dark's muted gray (#b0b1b3) is close to its text color (#dfe1e5), so a run of rows looks like more paragraphs. Rows also sit right against the messages, with no space between.</p>
<p>t3code draws every row in one dimmer gray, in the UI font, and keeps bright text for messages. The first topic is a row's text; the second is what sets a run of rows apart from the messages around it. The mocks replay the turn in your screenshot, in JetBrains Dark's colors, at the app's sizes (messages 14px, rows 24px tall).</p>`;
</script>
