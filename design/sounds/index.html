<script>
const TOPICS = [];
window.ROUND_INTRO = `<p>agentZ plays <b>no sounds</b> today. It shows a macOS notification ("Finished", "Waiting for tool confirmation", "Waiting for your input") whenever a thread isn't on screen. That includes when agentZ is in front and you're looking at another thread. Agents in Workspaces terminal panes get neither a sound nor a notification. No setting controls any of this.</p>
<p>This round adds a sound when an agent <b>finishes</b>, a different one when it <b>needs input</b> (a permission or a question), settings for when each plays, and notifications only while agentZ <b>isn't focused</b>. You picked t3code's two sounds in the chat:
<button class="tbtn" onclick="new Audio('audio/finished.mp3').play()">▶ Finished</button>
<button class="tbtn" onclick="new Audio('audio/needs-input.mp3').play()">▶ Needs input</button></p>
<p>Words used throughout: a thread is <b>on screen</b> when agentZ's window is in front, Settings is closed, and the thread is open in the Agents view or in a pane of the Workspaces tab showing. Otherwise it's <b>hidden</b>, as Zed calls it. <b>Focused</b> means agentZ is the app in front. Zed plays one sound (Never, When hidden, Always) for both events; herdr plays "done" only when hidden and "request" always; t3code plays its sounds even on screen and shows system notifications only when its window isn't focused. The mocks are Settings › General in One Dark, as it is today with new rows added.</p>`;
</script>
