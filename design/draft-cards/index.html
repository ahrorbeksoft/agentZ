window.ROUND_INTRO = `<p>You said: “I don’t like how threads with draft texts look.” You didn’t say what bothers you, so this round shows different ways to mark a draft, and your picks tell us.</p>
<p>Today agentZ copies t3code. A thread with <b>unsent text</b> (something typed in its composer and not sent) gets a small yellow pen before its project on its card, with the tooltip “Unsent draft”, and a Discard draft × beside Archive on hover. The open thread’s card has no pen. A <b>draft row</b> is a new thread with text typed in it and nothing sent yet: it sits above the cards, with the same yellow pen, its project, the first line of the text in place of a title, and a faint yellow tint. A faint line separates the draft rows from the cards. Zed lists a never-sent draft among its threads, titled with the draft’s first line, with a very faint icon. It doesn’t mark a thread that has unsent text.</p>
<p>This round decides what marks a card with unsent text, where on the card that mark goes, and whether draft rows change to match. Words used: a <b>card</b> is a thread’s three lines in the Agents sidebar (project and state, title, branch with the machine and agent). The <b>mark</b> is whatever says a card has unsent text. The mocks use the board’s demo world (storefront and api) in One Dark. Add the checkout page is the open thread. Write tests for the rate limiter and Speed up the product grid have unsent text.</p>`;
</script>
