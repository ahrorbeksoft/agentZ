const TOPICS = [];
window.ROUND_INTRO = `<p>You said: “We need more options for notifications, because ‘when hidden’ here means when you are outside of the thread, not outside the app. And also we gotta be able to change the volume.”</p>
<p>Today Settings › Notifications has two sound rows, each with <b>Never</b>, <b>When hidden</b> or <b>Always</b> (Zed’s values), and one switch for system notifications, which show only while agentZ isn’t the app in front. <b>When hidden</b> plays whenever the thread isn’t on screen, so it also plays while you work in agentZ on another thread. There is no choice for “only when I’m in another app”, and no volume.</p>
<p>Words used throughout: a thread is <b>on screen</b> when agentZ’s window is in front, Settings is closed, and the thread is open in the Agents view or in a pane of the Workspaces tab that’s showing. <b>In front</b> means agentZ is the active app. Subthreads stay silent, and a thread with a background task still waits; these choices apply on top. The app’s two sounds:
<button class="tbtn" onclick="new Audio('../sounds/audio/zed-agent-done.m4a').play()">▶ Finished</button>
<button class="tbtn" onclick="new Audio('../sounds/audio/needs-input.mp3').play()">▶ Needs input</button></p>
<p>Zed, t3code and herdr have no volume setting; their sounds play at the system’s volume. macOS has one “Alert volume” slider for all alert sounds. The mocks are Settings › Notifications in One Dark, as the app draws it.</p>`;
</script>
