window.ROUND_INTRO = `<p>From the backlog: “Redesign every kind of input an agent can ask the user for, not just one.” This round covers each kind agents send today: a permission to use a tool (and Claude Agent’s plan, which comes as one), a question with choices, several questions at once, an MCP server’s form, a page to open, and a login. Then what they share: what stays once you answer, requests from subagents, the keyboard, and how the app shows that an agent waits.</p>
<p>Each topic starts with today’s screenshot, from the mock agent, which asks as the real agents do: Claude Agent’s permission choices and questions, Codex’s and Factory Droid’s choices, github’s form and linear’s sign-in page. The mocks use the app’s JetBrains Dark colors and sizes, and one demo thread: Claude Agent in <b>storefront</b>, adding a checkout total.</p>
<p>Later topics use the first topic’s recommended card where they show a permission, so they can be read on their own; if you pick another, the others follow it.</p>`;
