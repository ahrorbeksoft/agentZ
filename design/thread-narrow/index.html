window.ROUND_INTRO = `<p>Three things you said look bad in a thread: the note that marks <b>this thread’s account</b> in the composer’s account picker, and the <b>thread header</b> and the <b>composer</b> when the thread is narrow (a small window, or the Changes panel open beside it; a thread can get down to 320 px).</p>
<p>Already done, without a round, as you asked: the usage gauge is a plain button like the pickers, the initials sit centered in the avatars, “Outside agentZ” is “External” everywhere, the picker has no Add Account… (Manage Accounts… stays), a tool call no longer moves as it opens, and each thread keeps its own Changes panel and width.</p>
<p>The screenshots beside each topic are today’s app, rendered headlessly with made-up data: a Claude Agent thread on the <b>Personal</b> account, in a worktree on <code>agentz/fix-login-redirect</code>, with 42 lines added and 9 removed. The mocks are One Dark at the app’s sizes, shown at 560, 440 and 320 px.</p>`;
