window.ROUND_INTRO = `<p>You said: "Subagents are just shown like this. We gotta improve that, maybe show them with subthreads, maybe just improve the UI." (feedback #24, with a screenshot of Factory Droid's Task call as raw JSON).</p>
<p>A <b>subagent</b> here is one the agent starts itself, with its own tool: Factory Droid's <b>Task</b>, Claude Agent's <b>Agent</b> (Task before). It isn't an agentZ <b>subthread</b>, which an agent starts with agentZ's <code>delegate_task</code> and which shows in the <b>Agents list</b> over the composer. To agentZ a subagent is one more tool call: a row in the conversation that opens to its output, with the tool's input as JSON behind "Input".</p>
<p>What agents report differs, and limits what can be shown. <b>Factory Droid</b> sends the Task call (its type, a short description, the prompt and options) and, once it's done, the subagent's report; nothing in between. <b>Claude Agent</b> titles the call with the description and gives its report too, and also sends the subagent's own <b>steps</b> (its tool calls and text) into the thread, each marked with the call it belongs to. agentZ doesn't read the mark, so they show as the agent's own. Claude Agent can instead report each subagent as a session of its own, if agentZ says it takes them. <b>Devin</b> marks its subagents in its updates, which t3code reads. Claude Agent's steps and sessions are from its code: seeing them in agentZ would take a prompt to your real Claude, so they weren't.</p>
<p>Zed shows subagents (its own agent's) as cards in the conversation; t3code turns them into child threads and lists them with its own in the bar that agentZ's Agents list came from. The mocks are JetBrains Dark, your theme, at the app's sizes, and use the rows the Tool calls round picked.</p>`;
</script>
