<body data-area="thread" data-title="Thread">

  <span class="sp"></span>

</div>

<script src="../board/mock.js"></script>
<script>
const TOPICS = [];
window.ROUND_INTRO = `<p>How a conversation reads. Today agentZ follows Zed's thread: every tool call is its own row or card, edits show their diff inline, thinking is a block, and your messages are full-width boxes. t3code reads the same agent output (from ACP: messages, thoughts, tool calls with a kind such as read, edit, execute, search) and folds the agent's work between its messages into one line that says what it did, such as "Read 3 files and changed 2 files", opening into compact one-line rows. The mocks show one turn: you ask for a checkout total, the agent thinks, reads three files, edits two, runs the tests, and answers. Colors are JetBrains Dark's.</p>
<p>The last topic is steering a queued message. Over ACP an agent takes one message at a time, so nothing can be added to a turn while it runs; the choices are when the next message cuts in.</p>`;
</script>

<script src="../board/app.js"></script>
</body>
