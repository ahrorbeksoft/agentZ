const TOPICS = [];
window.ROUND_INTRO = `<p>You reported: “We gotta merge projects in the settings too, with a dropdown or select machines.” The settings sidebar lists each machine’s copy of a project as its own row (“ielts-today”, “ielts-today · Ahrorbek’s Laptop”, “fluency.uz” three times), while the project switcher and New Thread list a combined project once.</p>
<p>Today each row opens a page for that one copy: Project (Name, Icon, Monogram, Folder), Repository (Repository, Grouping, Combined with), Checkouts and Danger. Name, Icon and Monogram already change every copy; Folder, Grouping, Checkouts and Remove change only that copy. “Combined with” names the other copies in a sentence. The Agents and Usage pages pick their machine with a dropdown in the top right (“This Mac”).</p>
<p>This round decides how the settings sidebar lists a combined project, how you choose the machine on its page, how the page separates what’s shared from what belongs to one copy, and what Remove removes. The topics build on each other: “Choosing the machine” offers options that only fit one sidebar or one Remove, and says so.</p>
<p>Words used: a <b>combined project</b> is one repository’s folders on several machines shown as one project (General’s “Combine matching repositories across machines”). A <b>copy</b> is one machine’s folder of it, with its own threads. <b>Checkouts</b> are the worktrees and pastures made from a copy, as in the page’s Checkouts section. The mocks use the projects from your screenshot, in One Dark at the app’s sizes.</p>`;
</script>
