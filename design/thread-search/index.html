<p>t3code’s find (⌘F) floats over the chat, searches your messages, the agent’s messages and proposed plans across the whole thread (the server searches older pages too), ignores case, opens folded messages and plans to show a match, and closes when you switch threads. Zed has a thread search too: a strip under the header with case, whole-word and regex options, searching messages, open thoughts, tool calls’ titles and whatever tool output is shown. agentZ has neither; its terminal has a find bar, and its Markdown can already paint search matches.</p>
<p>Today’s pictures are recreated from the code in HTML, not captured from the running app (this machine has no display). The mocks use One Dark and the board’s demo: storefront’s “Add a promo code field” with Claude Agent, searched for “promo”.</p>`;
