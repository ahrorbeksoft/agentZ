window.ROUND_INTRO = `<p>Today each agent has <b>one login</b>. Its page in Settings › Agents has an Account card with the email and plan, Change Account and Log Out, and a note when the login was made outside agentZ. Nothing shows the agent’s usage limits, and nothing in a thread says which login it runs on.</p>
<p>This round adds <b>several accounts per agent</b>, as planned in <a href="plan.md">plan.md</a>. Each account has its own folder, login, sessions and history, and accounts run side by side. Already decided: the agent’s own login is the <b>External</b> account. It is listed only while the agent is logged in outside agentZ, and every login made in agentZ gets its own folder, so the CLI’s history stays clean. Each account shows its <b>usage limits</b>, read from the agent. It also gets the <b>actions</b> the agents offer when a limit runs out: Droid’s switch to Droid Core or extra usage, Codex’s limit resets, Claude’s usage credits, and waiting for the reset. The round also covers picking an account for a new thread, and the <b>skills</b> and <b>MCP servers</b> agentZ will hand to every agent.</p>
<p>Sources: t3code runs a second Codex as a provider instance (“Add ChatGPT account”) and has a Usage page with limit bars and a “Use reset” button. Droid’s <code>/limits</code>, Codex’s <code>/usage</code> and Claude’s <code>/rate-limit-options</code> are where the agents offer the limit actions. Zed has no accounts; its MCP servers are added as JSON. The demo world: Claude Agent with three accounts, <b>alex@hey.com</b> (External, Max 5x), <b>Work</b> (alex@acme.co, Team, its 5-hour limit used up) and <b>Side</b> (alex.side@gmail.com, Pro). Mocks are One Dark at the app’s sizes; the screenshots beside each topic are today’s app with the mock agent.</p>`;
</script>
