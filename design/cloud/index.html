window.ROUND_INTRO = `<p>Today every machine but this Mac is an <b>SSH target</b>. A cloud computer is one too (proton-cloud is the Proton computer devbox-3), so agentZ can’t create, start, stop or pause it, and doesn’t know what it costs.</p>
<p>This round adds <b>cloud providers</b>, starting with <b>Instabox</b> (free in beta: Linux machines with pause and resume, snapshots, public ports, a desktop, a Vault) and <b>Proton</b> ($20 a month while running, billed by the second: one persistent computer). Each offers everything it has, as planned in <a href="plan.md">plan.md</a>. Already decided there: you install each provider’s <b>CLI</b> and sign in with it; agentZ finds it, runs it, and keeps no credentials. Providers you haven’t set up are listed with <b>Learn More</b>, their install command, and agentZ’s promo or invite code once a provider offers one. Once a cloud machine runs, it connects over SSH exactly as Devbox 1 does, with its own server, agents and logins. A third provider adds a module, not UI: everything here shows only what a provider has.</p>
<p>The demo world: This Mac, <b>Devbox 1</b> over SSH, an Instabox account (alex@hey.com) with <b>agents-1</b> running and <b>review-box</b> paused, and a Proton account with <b>proton-cloud</b> (devbox-3) running and <b>scratch</b> stopped, $14.20 left. Topics 2 and 3 use this Mac’s real state instead: Proton’s CLI signed in, Instabox’s not installed. Mocks are One Dark at the app’s sizes; the screenshots beside topics are today’s app.</p>`;
