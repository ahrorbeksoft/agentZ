# Publishes a release when a version tag is pushed: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the version in crates/app/Cargo.toml. The release has the universal macOS
# app, the x86_64 Linux app, the Linux servers (also bundled in the apps, for machines they
# reach over SSH), install.sh and SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-servers:
    name: Linux servers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/app/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match version $version in crates/app/Cargo.toml"
            exit 1
          fi
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: tooling/build-remote-servers.sh x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: linux-servers
          path: target/remote-servers/
          if-no-files-found: error

  macos-app:
    name: macOS app
    needs: linux-servers
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: linux-servers
          path: target/remote-servers
      - run: tooling/bundle-mac.sh --universal
      - name: Zip the app
        run: ditto -c -k --keepParent target/bundle/agentZ.app target/bundle/agentZ-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: target/bundle/agentZ-macos.zip
          if-no-files-found: error

  linux-app:
    name: Linux app
    needs: linux-servers
    # The oldest Ubuntu runner, so the app runs where glibc is older too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries GPUI builds against (Zed's list, as agentZ needs them)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libfontconfig-dev libzstd-dev
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: linux-servers
          path: target/remote-servers
      - run: tooling/bundle-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-app
          path: target/bundle/agentZ-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [linux-servers, macos-app, linux-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp site/install.sh dist/
          cd dist
          sha256sum agentZ-macos.zip agentZ-linux-*.tar.gz agentz-server-* install.sh > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "agentZ ${GITHUB_REF_NAME#v}" \
            agentZ-macos.zip agentZ-linux-*.tar.gz agentz-server-* install.sh SHA256SUMS
