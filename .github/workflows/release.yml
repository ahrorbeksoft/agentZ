# Publishes a release when a version tag is pushed: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the workspace's version in Cargo.toml. The release has an app per platform,
# each with only its own server (a DMG per kind of Mac, the x86_64 Linux app as .tar.xz), every
# platform's server as agentz-server-<rust target>.gz, which the apps download for machines
# they reach over SSH, and SHA256SUMS, which site/install.sh and the apps check them against.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The release the apps download other machines' servers from.
  AGENTZ_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  linux-servers:
    name: Linux servers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: tooling/build-remote-servers.sh x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Compress the servers
        run: |
          mkdir -p target/release-assets
          for server in target/remote-servers/agentz-server-*-linux-musl; do
            gzip -9 -n -c "$server" > "target/release-assets/$(basename "$server").gz"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux-servers
          path: target/remote-servers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: assets-linux-servers
          path: target/release-assets/
          if-no-files-found: error

  macos-apps:
    name: macOS apps
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: tooling/build-remote-servers.sh aarch64-apple-darwin x86_64-apple-darwin
      - run: tooling/bundle-mac.sh --dmg aarch64-apple-darwin
      - run: tooling/bundle-mac.sh --dmg x86_64-apple-darwin
      - name: Gather the DMGs and compress the servers
        run: |
          mkdir -p target/release-assets
          mv target/bundle/agentZ-macos-*.dmg target/release-assets/
          for server in target/remote-servers/agentz-server-*-apple-darwin; do
            gzip -9 -n -c "$server" > "target/release-assets/$(basename "$server").gz"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: assets-macos
          path: target/release-assets/
          if-no-files-found: error

  linux-app:
    name: Linux app
    needs: linux-servers
    # The oldest Ubuntu runner, so the app runs where glibc is older too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries GPUI builds against (Zed's list, as agentZ needs them)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libfontconfig-dev libzstd-dev
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: linux-servers
          path: target/remote-servers
      - run: tooling/bundle-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: assets-linux-app
          path: target/bundle/agentZ-linux-x86_64.tar.xz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [linux-servers, macos-apps, linux-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "assets-*"
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum agentZ-* agentz-server-*.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "agentZ ${GITHUB_REF_NAME#v}" \
            agentZ-* agentz-server-*.gz SHA256SUMS
